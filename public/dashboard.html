<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — Certsift</title>
<link rel="stylesheet" href="/css/styles.css">
</head>
<body>

<div style="background:var(--ink);color:#fff;text-align:center;padding:6px 16px;font-size:13px;">
  Need help? <a href="tel:+2347013527505" style="color:#fff;font-weight:600;text-decoration:underline;">Contact Support: +234-701-3527-505</a>
</div>
<div class="nav">
  <a class="brand" href="/"><div class="mark">C</div><div class="name">Certsift</div></a>
  <div class="nav-links">
    <div style="display:flex;flex-direction:column;align-items:flex-end;">
      <div class="muted" id="signed-in-email" style="font-size:11px;"></div>
      <div class="token-pill" id="token-pill" title="">🪙 <span id="token-balance">–</span> tokens</div>
      <div class="muted" id="token-breakdown" style="font-size:11px;margin-top:2px;"></div>
    </div>
    <button class="btn btn-gold" id="topup-btn">Top up</button>
    <button class="btn btn-ghost" id="logout-btn">Log out</button>
  </div>
</div>

<div class="container">

  <!-- STEP 1: template picker -->
  <section id="step-templates">
    <h2>1. Choose a template</h2>
    <div class="grid grid-3" id="template-grid"></div>
  </section>

  <!-- STEP 2: batch builder -->
  <section id="step-builder" class="hidden" style="margin-top:36px;">
    <h2>2. Add recipients <span class="muted" id="selected-template-name"></span></h2>

    <div class="card" style="margin-bottom:18px;">
      <label>Issuing organization (shown on every certificate)</label>
      <input type="text" id="issuing-org" placeholder="e.g. Grace Chapel">
      <label style="display:flex;align-items:center;gap:8px;margin-top:16px;">
        <input type="checkbox" id="same-email" style="width:auto;"> Send all certificates in this batch as one email with multiple attachments
      </label>
      <label style="display:flex;align-items:center;gap:8px;margin-top:10px;">
        <input type="checkbox" id="copy-me" style="width:auto;"> Copy me — also send all certificates in this batch to my own email, in addition to recipients
      </label>
    </div>

    <div id="cert-rows"></div>
    <button class="btn btn-ghost" id="add-row-btn" style="margin-top:10px;">+ Add another recipient</button>

    <div style="margin-top:24px;display:flex;align-items:center;gap:14px;">
      <button class="btn btn-primary" id="submit-batch-btn">Generate &amp; send batch</button>
      <span class="muted" id="batch-cost-note"></span>
    </div>
    <div class="error-text hidden" id="batch-error"></div>
  </section>

  <!-- STEP 3: batch status -->
  <section id="step-status" class="hidden" style="margin-top:36px;">
    <h2>Batch status</h2>
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
        <span id="batch-status-badge" class="badge badge-pending">Processing…</span>
        <div>
          <button class="btn btn-ghost" id="download-all-btn">Download all (.zip)</button>
          <button class="btn btn-primary" id="new-batch-btn" style="margin-left:8px;">Start a new batch</button>
        </div>
      </div>
      <div class="success-text hidden" id="refund-notice" style="margin-bottom:12px;"></div>
      <table>
        <thead><tr><th>Recipient</th><th>Program</th><th>Cert #</th><th>Generation</th><th>Delivery</th><th></th></tr></thead>
        <tbody id="status-rows"></tbody>
      </table>
    </div>
  </section>

</div>

<!-- Top-up modal -->
<div id="topup-modal" class="hidden" style="position:fixed;inset:0;background:rgba(22,35,63,.5);display:flex;align-items:center;justify-content:center;z-index:200;">
  <div class="card" style="max-width:380px;width:90%;">
    <h3>Top up tokens</h3>
    <p class="muted">Every ₦1 tops up 1 token. Certificates cost 50 tokens (₦50) each. Minimum ₦800.</p>
    <label>Amount (₦)</label>
    <input type="number" id="topup-amount" min="800" step="50" value="800">
    <p class="muted" id="topup-tokens-preview" style="margin-top:6px;"></p>
    <div style="display:flex;gap:10px;margin-top:18px;">
      <button class="btn btn-primary" id="topup-confirm-btn" style="flex:1;">Pay with Paystack</button>
      <button class="btn btn-ghost" id="topup-cancel-btn">Cancel</button>
    </div>
    <div class="error-text hidden" id="topup-error"></div>
  </div>
</div>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="/js/config.js"></script>
<script src="/js/supabaseClient.js"></script>
<script>
let templates = [];
let selectedTemplate = null;
let rowCount = 0;
let currentBatchId = null;
let statusPoll = null;
let notifiedFailedCertIds = new Set();
let tokensRefundedThisBatch = 0;

const FIXED_FIELD_IDS = ['recipient-name', 'course-title', 'institution-name', 'certificate-number'];

init();

async function init() {
  const session = await requireSession();
  if (!session) return;
  await refreshWallet();
  await loadTemplateFileMap();
  await loadTemplates();
  await maybeVerifyPendingTopup();

  document.getElementById('logout-btn').addEventListener('click', async () => {
    await supabaseClient.auth.signOut();
    window.location.href = '/login.html';
  });
  document.getElementById('topup-btn').addEventListener('click', () => document.getElementById('topup-modal').classList.remove('hidden'));
  document.getElementById('topup-cancel-btn').addEventListener('click', () => document.getElementById('topup-modal').classList.add('hidden'));
  document.getElementById('topup-amount').addEventListener('input', updateTopupPreview);
  document.getElementById('topup-confirm-btn').addEventListener('click', startTopup);
  document.getElementById('add-row-btn').addEventListener('click', () => {
    const rows = document.querySelectorAll('#cert-rows > div');
    const lastRow = rows[rows.length - 1];
    addCertRow(lastRow);
  });
  document.getElementById('submit-batch-btn').addEventListener('click', submitBatch);
  document.getElementById('download-all-btn').addEventListener('click', downloadAll);
  document.getElementById('new-batch-btn').addEventListener('click', resetBatchForm);
  updateTopupPreview();
}

async function refreshWallet() {
  const { data: { user } } = await supabaseClient.auth.getUser();
  document.getElementById('signed-in-email').textContent = user.email;
  const { data, error } = await supabaseClient.from('wallets').select('trial_tokens_remaining, purchased_tokens').eq('user_id', user.id).single();
  if (!error && data) {
    const total = data.trial_tokens_remaining + data.purchased_tokens;
    document.getElementById('token-balance').textContent = total;
    document.getElementById('token-pill').title =
      `${data.trial_tokens_remaining} free trial + ${data.purchased_tokens} purchased (₦${data.purchased_tokens * 50} paid) = ${total} tokens`;
    document.getElementById('token-breakdown').textContent =
      `${data.trial_tokens_remaining} trial + ${data.purchased_tokens} purchased`;
  }
}

async function loadTemplates() {
  const resp = await fetch('/api/templates-list');
  const data = await resp.json();
  templates = data.templates || [];
  const grid = document.getElementById('template-grid');
  grid.innerHTML = '';
  for (const t of templates) {
    const card = document.createElement('div');
    card.className = 'template-card';
    card.innerHTML = `<img src="/assets/templates/${encodeURIComponent(templateFile(t))}" alt="${escapeHtml(t.name)}"><h3 style="margin-top:10px;font-size:15px;">${escapeHtml(t.name)}</h3>`;
    card.addEventListener('click', () => selectTemplate(t, card));
    grid.appendChild(card);
  }
}

function templateFile(t) {
  return window.__templateFiles?.[t.id] || `${t.id}.svg`;
}

async function selectTemplate(t, cardEl) {
  document.querySelectorAll('.template-card').forEach((c) => c.classList.remove('selected'));
  cardEl.classList.add('selected');
  selectedTemplate = t;
  document.getElementById('selected-template-name').textContent = `— ${t.name}`;
  document.getElementById('step-builder').classList.remove('hidden');
  document.getElementById('cert-rows').innerHTML = '';
  rowCount = 0;
  try {
    addCertRow();
    updateBatchCost();
  } catch (err) {
    const errEl = document.getElementById('batch-error');
    errEl.textContent = `Couldn't build the recipient form for this template: ${err.message}`;
    errEl.classList.remove('hidden');
    console.error(err);
  }
  document.getElementById('step-builder').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function addCertRow(sourceRowEl) {
  rowCount++;
  const id = `row-${rowCount}`;
  const wrapper = document.createElement('div');
  wrapper.className = 'card';
  wrapper.style.marginTop = '14px';
  wrapper.dataset.rowId = id;

  const dynamicFields = (selectedTemplate?.fields || []).filter(
    (f) => !FIXED_FIELD_IDS.includes(f.id) && !f.auto
  );

  let dynamicHtml = '';
  for (const f of dynamicFields) {
    if (f.type === 'text') {
      dynamicHtml += `<div><label>${labelFor(f.id)}${f.required ? '' : ' (optional)'}</label>
        <input type="text" data-field="${f.id}" data-kind="text" ${f.required ? 'required' : ''}></div>`;
    } else if (f.type === 'image') {
      dynamicHtml += `<div><label>${labelFor(f.id)}${f.required ? '' : ' (optional)'}</label>
        <input type="file" accept="image/png,image/jpeg" data-field="${f.id}" data-kind="image" ${f.required ? 'required' : ''}></div>`;
    } else if (f.type === 'block-toggle') {
      dynamicHtml += `<div style="display:flex;align-items:center;gap:8px;margin-top:14px;">
        <input type="checkbox" data-field="${f.id}" data-kind="toggle" checked style="width:auto;"> <label style="margin:0;">Include: ${labelFor(f.id)}</label></div>`;
    }
  }

  wrapper.innerHTML = `
    <div style="display:flex;justify-content:space-between;"><strong>Recipient ${rowCount}</strong>
      <button type="button" class="btn btn-ghost remove-row-btn" style="padding:4px 10px;">Remove</button></div>
    <div class="grid grid-2">
      <div><label>Recipient name</label><input type="text" data-field="recipient_name" data-kind="core" required></div>
      <div><label>Program / course title</label><input type="text" data-field="program_title" data-kind="core" required></div>
      <div><label>Recipient email (for auto-delivery)</label><input type="email" data-field="recipient_email" data-kind="core"></div>
    </div>
    <div class="grid grid-2">${dynamicHtml}</div>
  `;
  wrapper.querySelector('.remove-row-btn').addEventListener('click', () => { wrapper.remove(); updateBatchCost(); });
  document.getElementById('cert-rows').appendChild(wrapper);

  if (sourceRowEl) {
    for (const newInput of wrapper.querySelectorAll('[data-field]')) {
      const field = newInput.dataset.field;
      const kind = newInput.dataset.kind;
      if (kind === 'core' && (field === 'recipient_name' || field === 'recipient_email')) continue;

      const oldInput = sourceRowEl.querySelector(`[data-field="${field}"]`);
      if (!oldInput) continue;

      if (kind === 'toggle') {
        newInput.checked = oldInput.checked;
      } else if (kind === 'image') {
        if (oldInput.files && oldInput.files[0]) {
          const dt = new DataTransfer();
          dt.items.add(oldInput.files[0]);
          newInput.files = dt.files;
        }
      } else {
        newInput.value = oldInput.value;
      }
    }
  }

  updateBatchCost();
}

function labelFor(id) {
  return id.replace(/^opt-/, '').replace(/-/g, ' ').replace(/\b\w/g, (c) => c.toUpperCase());
}

function updateBatchCost() {
  const count = document.querySelectorAll('#cert-rows > div').length;
  document.getElementById('batch-cost-note').textContent = count ? `${count} certificate(s) = ${count * 50} token(s)` : '';
}

function fileToDataUri(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function submitBatch() {
  const errEl = document.getElementById('batch-error');
  errEl.classList.add('hidden');
  const rowEls = Array.from(document.querySelectorAll('#cert-rows > div'));
  if (!selectedTemplate || rowEls.length === 0) return;

  const certificates = [];
  for (const rowEl of rowEls) {
    const cert = { field_values: {} };
    for (const input of rowEl.querySelectorAll('[data-field]')) {
      const kind = input.dataset.kind;
      const field = input.dataset.field;
      if (kind === 'core') {
        cert[field] = input.value.trim();
      } else if (kind === 'text') {
        cert.field_values[field] = input.value.trim();
      } else if (kind === 'toggle') {
        cert.field_values[field] = input.checked;
      } else if (kind === 'image') {
        if (input.files[0]) cert.field_values[field] = await fileToDataUri(input.files[0]);
      }
    }
    if (!cert.recipient_name || !cert.program_title) {
      errEl.textContent = 'Every recipient needs a name and a program/course title.';
      errEl.classList.remove('hidden');
      return;
    }
    certificates.push(cert);
  }

  const headers = { 'Content-Type': 'application/json', ...(await getAuthHeader()) };
  const submitBtn = document.getElementById('submit-batch-btn');
  submitBtn.disabled = true;
  submitBtn.textContent = 'Submitting…';
  let resp, data;
  try {
    resp = await fetch('/api/create-batch', {
      method: 'POST',
      headers,
      body: JSON.stringify({
        templateId: selectedTemplate.id,
        issuingOrganization: document.getElementById('issuing-org').value.trim(),
        sameEmail: document.getElementById('same-email').checked,
        copyToSelf: document.getElementById('copy-me').checked,
        certificates,
      }),
    });
    data = await resp.json();
  } catch (networkErr) {
    submitBtn.disabled = false;
    submitBtn.textContent = 'Generate & send batch';
    errEl.textContent = 'Could not reach the server — check your connection. If tokens were already deducted, check your balance before retrying to avoid a duplicate batch.';
    errEl.classList.remove('hidden');
    return;
  }

  if (!resp.ok) {
    submitBtn.disabled = false;
    submitBtn.textContent = 'Generate & send batch';
    errEl.textContent = data.error || 'Something went wrong.';
    errEl.classList.remove('hidden');
    return;
  }

  submitBtn.textContent = 'Batch submitted ✓';
  document.getElementById('add-row-btn').disabled = true;
  for (const input of document.querySelectorAll('#cert-rows input')) input.disabled = true;
  for (const btn of document.querySelectorAll('.remove-row-btn')) btn.disabled = true;

  currentBatchId = data.batchId;
  document.getElementById('step-status').classList.remove('hidden');
  document.getElementById('step-status').scrollIntoView({ behavior: 'smooth', block: 'start' });
  await refreshWallet();
  pollStatus();
}

function resetBatchForm() {
  clearInterval(statusPoll);
  currentBatchId = null;
  document.getElementById('step-status').classList.add('hidden');
  document.getElementById('cert-rows').innerHTML = '';
  rowCount = 0;
  document.getElementById('batch-error').classList.add('hidden');
  document.getElementById('refund-notice').classList.add('hidden');

  const submitBtn = document.getElementById('submit-batch-btn');
  submitBtn.disabled = false;
  submitBtn.textContent = 'Generate & send batch';
  document.getElementById('add-row-btn').disabled = false;

  if (selectedTemplate) {
    addCertRow();
    updateBatchCost();
  }
  document.getElementById('step-builder').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

async function pollStatus() {
  clearInterval(statusPoll);
  notifiedFailedCertIds = new Set();
  tokensRefundedThisBatch = 0;
  document.getElementById('refund-notice').classList.add('hidden');
  await fetchStatus();
  statusPoll = setInterval(fetchStatus, 4000);
}

async function fetchStatus() {
  if (!currentBatchId) return;
  const headers = await getAuthHeader();
  const resp = await fetch(`/api/batch-status?batchId=${currentBatchId}`, { headers });
  const data = await resp.json();
  if (!resp.ok) return;

  const badge = document.getElementById('batch-status-badge');
  if (data.batch.status === 'completed') {
    badge.textContent = 'Completed'; badge.className = 'badge badge-verified';
    clearInterval(statusPoll);
  } else if (data.batch.status === 'failed') {
    badge.textContent = 'Failed'; badge.className = 'badge badge-failed';
    clearInterval(statusPoll);
  } else {
    badge.textContent = 'Processing…'; badge.className = 'badge badge-pending';
  }

  const tbody = document.getElementById('status-rows');
  tbody.innerHTML = '';
  const newlyFailed = [];
  for (const c of data.certificates) {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${escapeHtml(c.recipient_name)}</td>
      <td>${escapeHtml(c.program_title)}</td>
      <td>${escapeHtml(c.certificate_number)}</td>
      <td>${statusBadge(c.generation_status)}</td>
      <td>${statusBadge(c.delivery_status)}</td>
      <td>${c.pdf_path ? `<button class="btn btn-ghost" style="padding:4px 10px;" onclick="downloadOne('${c.id}')">Download</button>` : ''}</td>
    `;
    tbody.appendChild(tr);

    if (c.generation_status === 'failed' && !notifiedFailedCertIds.has(c.id)) {
      notifiedFailedCertIds.add(c.id);
      newlyFailed.push(c);
    }
  }

  if (newlyFailed.length > 0) {
    tokensRefundedThisBatch += newlyFailed.length * 50;
    const namesList = newlyFailed.map((c) => escapeHtml(c.recipient_name)).join(', ');
    const notice = document.getElementById('refund-notice');
    notice.textContent = `${newlyFailed.length} certificate(s) failed to generate (${namesList}) — ${newlyFailed.length * 50} token(s) refunded. Total refunded this batch: ${tokensRefundedThisBatch}.`;
    notice.classList.remove('hidden');
    await refreshWallet();
  } else {
    await refreshWallet();
  }
}

function statusBadge(s) {
  const cls = s === 'generated' || s === 'sent' ? 'badge-verified' : s === 'failed' ? 'badge-failed' : 'badge-pending';
  return `<span class="badge ${cls}">${s}</span>`;
}

async function downloadOne(certificateId) {
  const headers = await getAuthHeader();
  const resp = await fetch(`/api/download?certificateId=${certificateId}`, { headers });
  const data = await resp.json();
  if (data.url) window.open(data.url, '_blank');
}

async function downloadAll() {
  if (!currentBatchId) return;
  const headers = await getAuthHeader();
  const resp = await fetch(`/api/download?batchId=${currentBatchId}`, { headers });
  const blob = await resp.blob();
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `certificates-${currentBatchId}.zip`;
  a.click();
  URL.revokeObjectURL(url);
}

function updateTopupPreview() {
  const amount = Number(document.getElementById('topup-amount').value || 0);
  const tokens = Math.floor(amount);
  const certs = Math.floor(tokens / 50);
  document.getElementById('topup-tokens-preview').textContent = amount >= 800
    ? `₦${amount} = ${tokens} tokens (worth ${certs} certificates) — adds to your existing balance`
    : 'Minimum top-up is ₦800';
}

async function startTopup() {
  const errEl = document.getElementById('topup-error');
  errEl.classList.add('hidden');
  const amount = Number(document.getElementById('topup-amount').value || 0);
  const headers = { 'Content-Type': 'application/json', ...(await getAuthHeader()) };
  const resp = await fetch('/api/paystack-initialize', {
    method: 'POST', headers, body: JSON.stringify({ amountNaira: amount }),
  });
  const data = await resp.json();
  if (!resp.ok) { errEl.textContent = data.error; errEl.classList.remove('hidden'); return; }
  window.location.href = data.authorization_url;
}

async function maybeVerifyPendingTopup() {
  const params = new URLSearchParams(location.search);
  const reference = params.get('reference') || params.get('trxref');
  if (!reference) return;
  const headers = { 'Content-Type': 'application/json', ...(await getAuthHeader()) };
  const resp = await fetch('/api/paystack-verify', { method: 'POST', headers, body: JSON.stringify({ reference }) });
  const data = await resp.json();
  if (data.credited) {
    await refreshWallet();
  }
  window.history.replaceState({}, '', '/dashboard.html');
}

function escapeHtml(s){ const d = document.createElement('div'); d.textContent = s ?? ''; return d.innerHTML; }

async function loadTemplateFileMap() {
  const resp = await fetch('/assets/templates.json');
  const j = await resp.json();
  window.__templateFiles = {};
  for (const t of j.templates) window.__templateFiles[t.id] = t.file;
}
</script>
</body>
</html>
