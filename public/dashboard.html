<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — Certsift</title>
<link rel="stylesheet" href="/css/styles.css">
</head>
<body>

<div style="background:var(--ink);color:#fff;text-align:center;padding:6px 16px;font-size:13px;">
  Need help? <a href="tel:+2347013527505" style="color:#fff;font-weight:600;text-decoration:underline;">Contact Support: +234-701-3527-505</a>
</div>
<div class="nav">
  <a class="brand" href="/"><div class="mark">C</div><div class="name">Certsift</div></a>
  <div class="nav-links">
    <a class="btn btn-ghost" href="/" title="Return to the homepage — you'll stay logged in">🏠 Home</a>
    <div style="display:flex;flex-direction:column;align-items:flex-end;">
      <div class="muted" id="signed-in-email" style="font-size:11px;"></div>
      <div class="token-pill" id="token-pill" title="">🪙 <span id="token-balance">–</span> tokens</div>
      <div class="muted" id="token-breakdown" style="font-size:11px;margin-top:2px;"></div>
    </div>
    <button class="btn btn-gold" id="topup-btn">Top up</button>
    <button class="btn btn-ghost" id="logout-btn">Log out</button>
  </div>
</div>

<div class="container">

  <!-- STEP 1: template picker -->
  <section id="step-templates">
    <h2>1. Choose a template</h2>
    <div class="grid grid-3" id="template-grid"></div>
  </section>

  <!-- Template popularity — shown so people can see what others are
       generating most. Purely informational, no action tied to it. -->
  <section id="popularity-section" class="hidden" style="margin-top:28px;">
    <div class="card" style="max-width:520px;">
      <h3 style="margin-bottom:10px;">Popular templates</h3>
      <p class="muted" style="font-size:12px;margin-bottom:10px;">What other organizations are generating most on Certsift.</p>
      <ol id="popularity-list" style="padding-left:18px;color:var(--ink-soft);"></ol>
    </div>
  </section>

  <!-- STEP 2: batch builder -->
  <section id="step-builder" class="hidden" style="margin-top:36px;">
    <h2>2. Add recipients <span class="muted" id="selected-template-name"></span></h2>

    <div class="card" style="margin-bottom:18px;">
      <label>Issuing organization (shown on every certificate)</label>
      <input type="text" id="issuing-org" placeholder="e.g. Grace Chapel">
      <label style="display:flex;align-items:center;gap:8px;margin-top:16px;">
        <input type="checkbox" id="same-email" style="width:auto;"> Send all certificates in this batch as one
