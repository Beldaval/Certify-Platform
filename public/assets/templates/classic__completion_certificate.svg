<text id="recognition-line2" x="1754.0" y="1315" text-anchor="middle" font-family="'Palatino Linotype', Georgia, 'Times New Roman', serif" font-size="42" fill="#2E2E2E">of all requirements established for the training program titled:</text>
<text x="1754" y="1430" text-anchor="middle" font-family="'Palatino Linotype', Georgia, 'Times New Roman', serif" font-size="60" fill="#152142" font-style="italic"><tspan font-weight="700">“</tspan><tspan id="course-title" font-weight="700">Title of Course / Program / Theme / Study</tspan><tspan font-weight="700">”</tspan></text>
<text y="1530" font-family="'Palatino Linotype', Georgia, 'Times New Roman', serif" font-size="42" fill="#2E2E2E" x="768.84">This program was conducted from <tspan id="start-date" font-weight="700" fill="#152142" style="text-decoration:underline;">Start Date</tspan> to <tspan id="end-date" font-weight="700" fill="#152142" style="text-decoration:underline;">End Date</tspan>, covering core modules,</text>
<text id="conducted-line2" x="1754.0" y="1588" text-anchor="middle" font-family="'Palatino Linotype', Georgia, 'Times New Roman', serif" font-size="42" fill="#2E2E2E">practical applications, and foundational principles outlined by the organizing body.</text>
<text y="1685" font-family="'Palatino Linotype', Georgia, 'Times New Roman', serif" font-size="44" fill="#2E2E2E" x="1290.4">Granted this <tspan id="award-day" font-weight="700" fill="#152142" style="text-decoration:underline;">Day</tspan> day of <tspan id="award-month" font-weight="700" fill="#152142" style="text-decoration:underline;">Month</tspan>, <tspan id="award-year" font-weight="700" fill="#152142" style="text-decoration:underline;">Year</tspan>.</text>
