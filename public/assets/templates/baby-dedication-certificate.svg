<text id="scripture-reference" x="1754.0" y="1100" text-anchor="middle" font-family="'Palatino Linotype', Georgia, 'Times New Roman', serif" font-style="italic" font-size="42" fill="#A6813E">— Proverbs 22:6</text>
</g>
<text id="certifies-label" x="1754.0" y="1200" text-anchor="middle" font-family="Georgia, 'Times New Roman', 'Palatino Linotype', serif" font-size="46" fill="#333333">This certifies that</text>
<text id="child-name" x="1754.0" y="1335" text-anchor="middle" font-family="Georgia, 'Times New Roman', 'Palatino Linotype', serif" font-weight="700" font-size="132" letter-spacing="2" fill="#152142">Child's Full Legal Name</text>
<line x1="994.0" y1="1378" x2="2514.0" y2="1378" stroke="#C9A15C" stroke-width="3"/>
<text y="1470" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="44" fill="#333333" x="628.42">born on the <tspan id="dob-day" font-weight="700" fill="#152142" style="text-decoration:underline;">Day</tspan> of <tspan id="dob-month" font-weight="700" fill="#152142" style="text-decoration:underline;">Month</tspan>, <tspan id="dob-year" font-weight="700" fill="#152142" style="text-decoration:underline;">Year</tspan>, was publicly and solemnly dedicated to the Almighty God</text>
<text y="1530" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="44" fill="#333333" x="784.98">at <tspan id="dedication-church-name" font-weight="700" fill="#152142" style="text-decoration:underline;">Church Name</tspan> on this <tspan id="dedication-day" font-weight="700" fill="#152142" style="text-decoration:underline;">Day</tspan> day of <tspan id="dedication-month" font-weight="700" fill="#152142" style="text-decoration:underline;">Month</tspan>, <tspan id="dedication-year" font-weight="700" fill="#152142" style="text-decoration:underline;">Year</tspan>.</text>
<g id="opt-covenant-text">
<text x="1754.0" y="1625" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="44" fill="#333333">By doing so, the parents covenant with God and this congregation</text>
<text id="covenant-text" x="1754.0" y="1678" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="44" fill="#333333">to raise this child in the nurture, admonition, and fellowship of the Lord.</text>
</g>
<text y="1785" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="42" fill="#333333"><tspan x="1143.3" font-weight="700" fill="#152142">Father's Full Name: </tspan><tspan id="father-name" x="1756.1">Father's First &amp; Last Name</tspan></text>
<text y="1843" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="42" fill="#333333"><tspan x="1143.3" font-weight="700" fill="#152142">Mother's Full Name: </tspan><tspan id="mother-name" x="1756.1">Mother's First &amp; Last Name</tspan></text>
<g id="opt-sponsor-names">
