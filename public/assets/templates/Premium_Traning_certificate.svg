<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="3508" height="2481" viewBox="0 0 3508 2481"
     font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">

  <title>Certificate of Completion — Leadership Training Template</title>

  <defs>
    <!-- ============ GRADIENTS ============ -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"  stop-color="#F4E2A1"/>
      <stop offset="18%" stop-color="#D9B855"/>
      <stop offset="40%" stop-color="#C9A227"/>
      <stop offset="55%" stop-color="#F6EAB6"/>
      <stop offset="70%" stop-color="#C9A227"/>
      <stop offset="100%" stop-color="#9C7B1E"/>
    </linearGradient>

    <linearGradient id="goldGradientSoft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B8912A"/>
      <stop offset="50%" stop-color="#EFD98C"/>
      <stop offset="100%" stop-color="#B8912A"/>
    </linearGradient>

    <linearGradient id="navyGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B2A4C"/>
      <stop offset="100%" stop-color="#0E1930"/>
    </linearGradient>

    <radialGradient id="sealGradient" cx="50%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#2A3F6B"/>
      <stop offset="55%" stop-color="#16233F"/>
      <stop offset="100%" stop-color="#0B1526"/>
    </radialGradient>

    <radialGradient id="ivoryVignette" cx="50%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#FBF6E9" stop-opacity="0"/>
      <stop offset="80%" stop-color="#FBF6E9" stop-opacity="0"/>
      <stop offset="100%" stop-color="#3A2E14" stop-opacity="0.06"/>
    </radialGradient>

    <!-- ============ PAPER TEXTURE ============ -->
    <filter id="paperTexture" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="7" result="noise"/>
      <feColorMatrix in="noise" type="matrix"
        values="0 0 0 0 0.72
                0 0 0 0 0.63
                0 0 0 0 0.42
                0 0 0 0.05 0" result="tinted"/>
    </filter>

    <filter id="softEmboss" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6" result="blur"/>
      <feSpecularLighting in="blur" surfaceScale="4" specularConstant="0.7" specularExponent="14"
        lighting-color="#FFFFFF" result="spec">
        <fePointLight x="-3000" y="-3000" z="4500"/>
      </feSpecularLighting>
      <feComposite in="spec" in2="SourceAlpha" operator="in" result="specClip"/>
      <feComposite in="SourceGraphic" in2="specClip" operator="arithmetic" k1="0" k2="1" k3="1" k4="0"/>
    </filter>

    <filter id="dropShadowSoft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0E1930" flood-opacity="0.28"/>
    </filter>

    <!-- ============ WATERMARK EMBLEM (abstract flame/dove) ============ -->
    <g id="watermarkEmblem">
      <path d="M0,-430
               C 140,-360 210,-210 170,-70
               C 145,20 60,70 0,140
               C -60,70 -145,20 -170,-70
               C -210,-210 -140,-360 0,-430 Z"
            fill="#1B2A4C"/>
      <path d="M0,140
               C 190,120 340,-10 380,-170
               C 300,-90 190,-40 90,-30
               C 170,-90 210,-190 200,-300
               C 130,-190 40,-120 0,-40 Z"
            fill="#1B2A4C"/>
      <path d="M0,140
               C -190,120 -340,-10 -380,-170
               C -300,-90 -190,-40 -90,-30
               C -170,-90 -210,-190 -200,-300
               C -130,-190 -40,-120 0,-40 Z"
            fill="#1B2A4C"/>
      <circle cx="0" cy="220" r="55" fill="#1B2A4C"/>
    </g>

  </defs>

  <!-- ======================================================= -->
  <!-- BACKGROUND -->
  <!-- ======================================================= -->
  <rect id="bg-base" x="0" y="0" width="3508" height="2481" fill="#FBF6E9"/>
  <rect id="bg-texture" x="0" y="0" width="3508" height="2481" filter="url(#paperTexture)" opacity="0.12"/>
  <rect id="bg-vignette" x="0" y="0" width="3508" height="2481" fill="url(#ivoryVignette)"/>

  <!-- Watermark, centered behind all content -->
  <g id="opt-watermark" transform="translate(1754,1260) scale(1.55)" opacity="0.045">
    <use xlink:href="#watermarkEmblem"/>
  </g>

  <!-- ======================================================= -->
  <!-- OUTER HAIRLINE FRAME -->
  <!-- ======================================================= -->
  <rect x="70" y="70" width="3368" height="2341" fill="none" stroke="#C9A227" stroke-width="2" opacity="0.55"/>
  <rect x="96" y="96" width="3316" height="2289" fill="none" stroke="#1B2A4C" stroke-width="2" opacity="0.35"/>

  <!-- ======================================================= -->
  <!-- CORNER GEOMETRIC PANELS (navy, gold accent lines) -->
  <!-- ======================================================= -->
  <g id="corner-top-left">
    <polygon points="0,0 560,0 0,560" fill="url(#navyGradient)"/>
    <polygon points="0,0 420,0 0,420" fill="none" stroke="url(#goldGradient)" stroke-width="4"/>
    <line x1="0" y1="470" x2="470" y2="0" stroke="url(#goldGradient)" stroke-width="3"/>
  </g>

  <g id="corner-top-right">
    <polygon points="3508,0 2948,0 3508,560" fill="url(#navyGradient)"/>
    <polygon points="3508,0 3088,0 3508,420" fill="none" stroke="url(#goldGradient)" stroke-width="4"/>
    <line x1="3508" y1="470" x2="3038" y2="0" stroke="url(#goldGradient)" stroke-width="3"/>
  </g>

  <g id="corner-bottom-left">
    <polygon points="0,2481 560,2481 0,1921" fill="url(#navyGradient)"/>
    <polygon points="0,2481 420,2481 0,2061" fill="none" stroke="url(#goldGradient)" stroke-width="4"/>
    <line x1="0" y1="2011" x2="470" y2="2481" stroke="url(#goldGradient)" stroke-width="3"/>
  </g>

  <g id="corner-bottom-right">
    <polygon points="3508,2481 2948,2481 3508,1921" fill="url(#navyGradient)"/>
    <polygon points="3508,2481 3088,2481 3508,2061" fill="none" stroke="url(#goldGradient)" stroke-width="4"/>
    <line x1="3508" y1="2011" x2="3038" y2="2481" stroke="url(#goldGradient)" stroke-width="3"/>
  </g>

  <!-- ======================================================= -->
  <!-- TOP: LOGO EMBLEM + INSTITUTION NAME -->
  <!-- ================================================================= -->
  <g id="logo-slot" transform="translate(1754,300)">
    <circle cx="0" cy="0" r="150" fill="#FBF6E9" stroke="url(#goldGradient)" stroke-width="6"/>
    <circle cx="0" cy="0" r="128" fill="none" stroke="#1B2A4C" stroke-width="2" opacity="0.5"/>
    <!-- Placeholder mark: replace this <g> content with the institution's own emblem/image -->
    <text x="0" y="16" text-anchor="middle" font-size="30" fill="#9C9C9C"
          font-style="italic" letter-spacing="1">LOGO</text>
  </g>

  <text id="institution-name" x="1754" y="565" text-anchor="middle"
        font-size="68" font-weight="700" fill="#1B2A4C" letter-spacing="6">
    NAME OF ISSUING INSTITUTION / BODY
  </text>

  <text id="opt-subtitle" x="1754" y="625" text-anchor="middle"
        font-size="34" font-weight="500" fill="#B8912A" letter-spacing="4">
    Optional: Department, Ministry, or Subsidiary
  </text>

  <line id="divider-line-top" x1="1554" y1="668" x2="1954" y2="668"
        stroke="#C9A227" stroke-width="3"/>
  <circle cx="1754" cy="668" r="6" fill="#C9A227"/>

  <!-- ======================================================= -->
  <!-- MAIN HEADING -->
  <!-- ======================================================= -->
  <text id="certificate-heading" x="1754" y="830" text-anchor="middle"
        font-size="128" font-weight="800" fill="#1B2A4C" letter-spacing="10">
    CERTIFICATE OF COMPLETION
  </text>

  <g id="divider-line-heading">
    <line x1="1254" y1="900" x2="1614" y2="900" stroke="#C9A227" stroke-width="3"/>
    <polygon points="1754,882 1774,900 1754,918 1734,900" fill="url(#goldGradient)"/>
    <line x1="1894" y1="900" x2="2254" y2="900" stroke="#C9A227" stroke-width="3"/>
  </g>

  <!-- ======================================================= -->
  <!-- RECIPIENT -->
  <!-- ======================================================= -->
  <text id="awarded-to-label" x="1754" y="1020" text-anchor="middle"
        font-size="44" font-weight="400" fill="#3A3A3A" font-style="italic">
    This is officially awarded to:
  </text>

  <text id="recipient-name" x="1754" y="1148" text-anchor="middle"
        font-size="104" font-weight="700" fill="#1B2A4C" letter-spacing="4">
    FIRST NAME &amp; SURNAME OF RECIPIENT
  </text>
  <line id="recipient-underline" x1="854" y1="1198" x2="2654" y2="1198"
        stroke="#C9A227" stroke-width="3"/>

  <!-- ======================================================= -->
  <!-- RECOGNITION TEXT -->
  <!-- ======================================================= -->
  <text id="recognition-text" text-anchor="middle" font-size="38" fill="#333333">
    <tspan x="1754" y="1320">in recognition of their dedicated participation and successful fulfillment of all</tspan>
    <tspan x="1754" y="1372">requirements established for the training program titled:</tspan>
  </text>

  <text id="course-title" x="1754" y="1540" text-anchor="middle"
        font-size="66" font-weight="700" font-style="italic" fill="#1B2A4C">
    &#8220;TITLE OF COURSE / PROGRAM / THEME / STUDY&#8221;
  </text>

  <text id="program-dates-text" text-anchor="middle" font-size="36" fill="#333333">
    <tspan x="1754" y="1698">This program was conducted from <tspan id="start-date" font-weight="700" fill="#1B2A4C" style="text-decoration:underline;">Start Date</tspan> to <tspan id="end-date" font-weight="700" fill="#1B2A4C" style="text-decoration:underline;">End Date</tspan>, covering core modules,</tspan>
    <tspan x="1754" y="1748">practical applications, and foundational principles outlined by the organizing body.</tspan>
  </text>

  <text id="award-date-line" x="1754" y="1950" text-anchor="middle"
        font-size="42" fill="#1B2A4C" font-weight="500">
    Granted this ________ day of ______________, 20____.
  </text>

  <!-- ======================================================= -->
  <!-- BOTTOM ROW: CERT NO. / SIGNATURES / SEAL -->
  <!-- ======================================================= -->

  <!-- Certificate number, bottom-left -->
  <g id="certificate-no" transform="translate(360,2180)">
    <text x="0" y="46" font-size="28" fill="#1B2A4C" font-weight="700" letter-spacing="2">CERTIFICATE NO.</text>
    <text id="certificate-number" x="0" y="88" font-size="34" fill="#3A3A3A" letter-spacing="1">HB-2025-00001</text>
  </g>

  <!-- Signature 1 -->
  <g id="signature-1" transform="translate(1130,2245)">
    <rect id="signature-1-slot" x="-190" y="-162" width="380" height="96" rx="6"
          fill="none" stroke="#B7B7B7" stroke-width="2" stroke-dasharray="10,8"/>
    <text x="0" y="-108" text-anchor="middle" font-size="26" fill="#B0B0B0"
          font-style="italic" letter-spacing="1">Signature</text>
    <line x1="-260" y1="0" x2="260" y2="0" stroke="#1B2A4C" stroke-width="2"/>
    <text id="signature-1-caption" x="0" y="-24" text-anchor="middle" font-size="36" fill="#9C9C9C"
          font-style="italic">Full Name of Signer</text>
    <text id="signature-1-title" x="0" y="54" text-anchor="middle" font-size="36" fill="#1B2A4C" font-weight="600">
      Title: e.g., Director / Pastor
    </text>
  </g>

  <!-- Signature 2 -->
  <g id="signature-2" transform="translate(2378,2245)">
    <rect id="signature-2-slot" x="-190" y="-162" width="380" height="96" rx="6"
          fill="none" stroke="#B7B7B7" stroke-width="2" stroke-dasharray="10,8"/>
    <text x="0" y="-108" text-anchor="middle" font-size="26" fill="#B0B0B0"
          font-style="italic" letter-spacing="1">Signature</text>
    <line x1="-260" y1="0" x2="260" y2="0" stroke="#1B2A4C" stroke-width="2"/>
    <text id="opt-signature-2-caption" x="0" y="-24" text-anchor="middle" font-size="36" fill="#9C9C9C"
          font-style="italic">Full Name of Signer</text>
    <text id="opt-signature-2-title" x="0" y="54" text-anchor="middle" font-size="36" fill="#1B2A4C" font-weight="600">
      Title: e.g., Registrar / HOD
    </text>
  </g>

  <!-- Official Seal, lower-right -->
  <g id="opt-seal-slot" transform="translate(3100,2130)" filter="url(#dropShadowSoft)">
    <circle r="165" fill="url(#sealGradient)"/>
    <circle r="165" fill="none" stroke="url(#goldGradient)" stroke-width="5"/>
    <circle r="140" fill="none" stroke="#EFD98C" stroke-width="1.5" opacity="0.7"/>
    <circle r="112" fill="none" stroke="url(#goldGradient)" stroke-width="2.5"/>

    <!-- circular text path -->
    <defs>
      <path id="sealTextPathTop" d="M -128,-18 A 132,132 0 0 1 128,-18"/>
      <path id="sealTextPathBottom" d="M -132,0 A 132,132 0 0 0 132,0"/>
    </defs>
    <text font-size="20" fill="#EFD98C" letter-spacing="4" font-weight="600">
      <textPath href="#sealTextPathTop" startOffset="50%" text-anchor="middle">OFFICIAL SEAL</textPath>
    </text>
    <text font-size="18" fill="#EFD98C" letter-spacing="3" font-weight="600">
      <textPath href="#sealTextPathBottom" startOffset="50%" text-anchor="middle">OF AUTHENTICATION</textPath>
    </text>

    <!-- central emblem -->
    <g transform="translate(0,-6) scale(0.19)" opacity="0.95">
      <use xlink:href="#watermarkEmblem" fill="#EFD98C"/>
    </g>
  </g>

  <!-- ======================================================= -->
  <!-- FOOTER BAND -->
  <!-- ======================================================= -->
  <rect x="0" y="2331" width="3508" height="150" fill="url(#navyGradient)"/>
  <line x1="0" y1="2331" x2="3508" y2="2331" stroke="#C9A227" stroke-width="4"/>

  <g id="footer-tagline">
    <text x="864" y="2416" font-size="32" fill="#F4E9C9" font-weight="400"
          textLength="520" lengthAdjust="spacingAndGlyphs">Equipping People</text>
    <circle cx="1444" cy="2408" r="6" fill="#C9A227"/>
    <text x="1504" y="2416" font-size="32" fill="#F4E9C9" font-weight="400"
          textLength="460" lengthAdjust="spacingAndGlyphs">Impacting Lives</text>
    <circle cx="2024" cy="2408" r="6" fill="#C9A227"/>
    <text x="2084" y="2416" font-size="32" fill="#F4E9C9" font-weight="400"
          textLength="560" lengthAdjust="spacingAndGlyphs">Changing the World</text>
  </g>

</svg>
