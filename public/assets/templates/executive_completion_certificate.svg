<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="3508" height="2481" viewBox="0 0 3508 2481"
     font-family="Arimo, 'Helvetica Neue', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>

  <!-- ============================= DEFS ============================= -->
  <defs>
    <linearGradient id="navyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B2A4A"/>
      <stop offset="100%" stop-color="#0F1A30"/>
    </linearGradient>

    <linearGradient id="goldGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F1DB96"/>
      <stop offset="45%" stop-color="#C9A227"/>
      <stop offset="100%" stop-color="#8E6E22"/>
    </linearGradient>

    <clipPath id="sealClip2"><circle cx="1754" cy="1720" r="150"/></clipPath>

    <!-- Diagonal navy/gold corner ribbon, echoing the reference design -->
    <g id="cornerRibbon">
      <path d="M0,0 L360,0 L0,360 Z" fill="url(#navyGrad)"/>
      <path d="M0,0 L300,0 L0,300 Z" fill="none" stroke="url(#goldGrad2)" stroke-width="10"/>
    </g>
  </defs>

  <!-- ============================= BACKGROUND ============================= -->
  <rect x="0" y="0" width="3508" height="2481" fill="#FCFBF6"/>

  <!-- corner ribbons: top-left and bottom-right, matching reference -->
  <use href="#cornerRibbon" xlink:href="#cornerRibbon" x="0" y="0"/>
  <use href="#cornerRibbon" xlink:href="#cornerRibbon" x="3508" y="2481" transform="rotate(180,3508,2481)"/>

  <!-- outer thin gold border -->
  <rect x="48" y="48" width="3412" height="2385" fill="none" stroke="url(#goldGrad2)" stroke-width="4"/>

  <!-- ============================= LOGO ============================= -->
  <!-- Optional. Whole block hidden entirely when not uploaded — no default
       icon rendered in its place, matching every other template's behavior. -->
  <g id="logo-block">
    <image id="opt-logo-slot" x="1634" y="134" width="240" height="160" href="" xlink:href="" preserveAspectRatio="xMidYMid meet"/>
  </g>

  <!-- ============================= INSTITUTION NAME ============================= -->
  <text id="institution-name" x="1754" y="368" text-anchor="middle" font-size="58" font-weight="700" letter-spacing="3" fill="#152442">NAME OF ISSUING INSTITUTION</text>
  <text id="opt-subtitle" x="1754" y="418" text-anchor="middle" font-size="27" letter-spacing="4" fill="#8E6E22">Department, Ministry, or Subsidiary</text>

  <!-- ============================= TITLE ============================= -->
  <text id="certificate-title" x="1754" y="600" text-anchor="middle" font-size="156" font-weight="700" letter-spacing="4" fill="#152442">CERTIFICATE</text>
  <text x="1754" y="706" text-anchor="middle" font-size="62" font-weight="700" letter-spacing="10" fill="#C9A227">OF COMPLETION</text>
  <line x1="1204" y1="748" x2="1554" y2="748" stroke="#C9A227" stroke-width="2.5"/>
  <line x1="1954" y1="748" x2="2304" y2="748" stroke="#C9A227" stroke-width="2.5"/>

  <!-- ============================= AWARDED TO ============================= -->
  <text x="1754" y="838" text-anchor="middle" font-size="44" letter-spacing="3" fill="#333029">THIS IS TO CERTIFY THAT</text>

  <text id="recipient-name" x="1754" y="990" text-anchor="middle" font-size="120" fill="#152442">Recipient&#8217;s Full Name</text>
  <line x1="954" y1="1046" x2="2554" y2="1046" stroke="#C9A227" stroke-width="2"/>

  <!-- ============================= COMPLETION LINE ============================= -->
  <text x="1754" y="1148" text-anchor="middle" font-size="44" fill="#333029">has successfully completed the</text>
  <text id="course-title" x="1754" y="1236" text-anchor="middle" font-size="64" font-weight="700" fill="#152442">Title of Course / Program / Theme of Study</text>

  <text x="1754" y="1336" text-anchor="middle" font-size="38" fill="#6B6250">
    <tspan x="1754" dy="0">This program was conducted from <tspan id="start-date" font-weight="700" fill="#152442">Start Date</tspan> to <tspan id="end-date" font-weight="700" fill="#152442">End Date</tspan>, covering core modules,</tspan>
    <tspan x="1754" dy="56">practical applications, and foundational principles outlined by the organizing body.</tspan>
  </text>

  <text x="1754" y="1480" text-anchor="middle" font-size="38" fill="#6B6250">
    <tspan x="1754" dy="0">In recognition of your dedication, hard work and commitment to</tspan>
    <tspan x="1754" dy="56">personal and professional growth.</tspan>
  </text>

  <!-- ============================= SEAL ============================= -->
  <!-- Optional. Decorative gold ring is just a neutral frame for whatever
       seal image the institution uploads — the whole block (frame + image)
       is hidden entirely when nothing is uploaded, same pattern as
       certificate_of_excellence.svg's seal-block. -->
  <g id="seal-block">
    <circle cx="1754" cy="1720" r="152" fill="url(#goldGrad2)" stroke="#8E6E22" stroke-width="2"/>
    <circle cx="1754" cy="1720" r="126" fill="none" stroke="#7A5E1E" stroke-width="1.5" opacity="0.7"/>
    <circle cx="1754" cy="1720" r="96" fill="none" stroke="#7A5E1E" stroke-width="1" opacity="0.5"/>
    <image id="opt-seal-slot" x="1604" y="1570" width="300" height="300" href="" xlink:href="" clip-path="url(#sealClip2)" preserveAspectRatio="xMidYMid slice"/>
  </g>

  <!-- ============================= DATE (left) ============================= -->
  <text x="600" y="1706" font-size="56" font-weight="700" fill="#152442">
    <tspan id="award-month">Month</tspan> <tspan id="award-day">Day</tspan>, <tspan id="award-year">Year</tspan>
  </text>
  <line x1="590" y1="1752" x2="1030" y2="1752" stroke="#C9A227" stroke-width="2"/>
  <text x="810" y="1802" text-anchor="middle" font-size="34" letter-spacing="2" fill="#6B6250">DATE</text>

  <!-- ============================= SIGNATURE (right) ============================= -->
  <g id="signature-1-block">
    <rect x="2450" y="1590" width="360" height="130" fill="none" stroke="#AEB7C6" stroke-width="2" stroke-dasharray="8 6"/>
    <text x="2630" y="1660" text-anchor="middle" font-size="24" fill="#B0A88E">Signature (PNG)</text>
    <image id="signature-1" x="2450" y="1590" width="360" height="130" href="" xlink:href="" preserveAspectRatio="xMidYMid meet"/>
    <line x1="2450" y1="1752" x2="2930" y2="1752" stroke="#C9A227" stroke-width="2"/>
    <text id="signature-1-caption" x="2690" y="1802" text-anchor="middle" font-size="34" fill="#152442" font-weight="700"></text>
    <text id="signature-1-title" x="2690" y="1846" text-anchor="middle" font-size="28" font-style="italic" fill="#6B6250"></text>
  </g>

  <!-- ============================= FOOTER ============================= -->
  <text id="certificate-number-label" x="230" y="2360" font-size="30" fill="#6B6250">Certificate ID:</text>
  <!-- system-generated: populate programmatically, do not expose to end-user editing UI -->
  <text id="certificate-number" x="410" y="2360" font-size="30" font-weight="700" fill="#152442">CS-2026-0000</text>

  <text x="1754" y="2360" text-anchor="middle" font-size="30" letter-spacing="2" fill="#152442">
    <tspan fill="#C9A227">LEARN</tspan> &#8226; <tspan fill="#C9A227">GROW</tspan> &#8226; <tspan fill="#C9A227">MAKE AN IMPACT</tspan>
  </text>

  <text x="3278" y="2360" text-anchor="end" font-size="30" fill="#152442">Verify at: certsift.com</text>

</svg>
