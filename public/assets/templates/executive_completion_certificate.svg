<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="3508" height="2481" viewBox="0 0 3508 2481"
     font-family="'Poppins','Century Gothic','Helvetica Neue',Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>

<!-- =====================================================================
  CERTSIFT — Certificate of Completion (v3 — calibrated against the
  supplied reference artwork's actual pixel measurements: element widths/
  heights were measured directly from the reference PNG and converted to
  this 3508-canvas scale, replacing earlier hand-estimated sizes/positions.

  FIELD KEY:
    BAKED    = fixed artwork/copy, not editable per-cert
    DYNAMIC  = replaced per certificate (has an id="")
    OPTIONAL = dynamic, safe to leave blank/default if org has no asset

  DYNAMIC text fields  : institution-name, opt-subtitle, certificate-type,
                         recipient-name, course-title, award-month/day/year,
                         signature-1-caption, signature-1-title, certificate-number
  OPTIONAL image slots : opt-logo-slot (org logo), signature-1 (signature PNG),
                         opt-seal-slot (org seal/badge — overrides the baked
                         default "CERTSIFT VERIFIED" seal when supplied)
  BAKED artwork        : corner ribbons, border, gold rules, footer tagline,
                         "Verify at" line, and the default "CERTSIFT VERIFIED"
                         seal design itself (shown unless opt-seal-slot is used)
===================================================================== -->

  <defs>
    <linearGradient id="navyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B2A4A"/>
      <stop offset="100%" stop-color="#0F1A30"/>
    </linearGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F1DB96"/>
      <stop offset="45%" stop-color="#C9A227"/>
      <stop offset="100%" stop-color="#8E6E22"/>
    </linearGradient>

    <g id="cornerRibbon">
      <path d="M0,0 L300,0 L0,300 Z" fill="url(#navyGrad)"/>
      <path d="M0,0 L250,0 L0,250 Z" fill="none" stroke="url(#goldGrad)" stroke-width="10"/>
    </g>

    <g id="wreathLeft" fill="#8E6E22">
      <path d="M-16.5,93.6 Q-29.0,82.2 -42.1,89.0 Q-32.1,99.9 -16.5,93.6 Z"/>
      <path d="M-41.5,89.1 Q-51.3,74.3 -66.4,77.5 Q-59.1,91.1 -41.5,89.1 Z"/>
      <path d="M-65.3,77.8 Q-71.3,60.3 -87.4,59.3 Q-83.6,74.9 -65.3,77.8 Z"/>
      <path d="M-85.9,60.1 Q-87.4,40.8 -103.3,35.3 Q-103.5,52.2 -85.9,60.1 Z"/>
      <path d="M-101.6,37.0 Q-98.1,17.1 -112.5,7.2 Q-117.1,24.1 -101.6,37.0 Z"/>
      <path d="M-111.0,9.7 Q-102.2,-9.4 -113.9,-23.3 Q-123.0,-7.5 -111.0,9.7 Z"/>
      <path d="M-113.0,-19.9 Q-99.1,-36.8 -107.0,-54.0 Q-120.2,-40.5 -113.0,-19.9 Z"/>
      <path d="M-106.9,-49.9 Q-88.6,-63.2 -91.7,-82.5 Q-108.5,-72.5 -106.9,-49.9 Z"/>
    </g>
    <g id="wreathRight" fill="#8E6E22">
      <path d="M16.5,93.6 Q32.1,99.9 42.1,89.0 Q29.0,82.2 16.5,93.6 Z"/>
      <path d="M41.5,89.1 Q59.1,91.1 66.4,77.5 Q51.3,74.3 41.5,89.1 Z"/>
      <path d="M65.3,77.8 Q83.6,74.9 87.4,59.3 Q71.3,60.3 65.3,77.8 Z"/>
      <path d="M85.9,60.1 Q103.5,52.2 103.3,35.3 Q87.4,40.8 85.9,60.1 Z"/>
      <path d="M101.6,37.0 Q117.1,24.1 112.5,7.2 Q98.1,17.1 101.6,37.0 Z"/>
      <path d="M111.0,9.7 Q123.0,-7.5 113.9,-23.3 Q102.2,-9.4 111.0,9.7 Z"/>
      <path d="M113.0,-19.9 Q120.2,-40.5 107.0,-54.0 Q99.1,-36.8 113.0,-19.9 Z"/>
      <path d="M106.9,-49.9 Q108.5,-72.5 91.7,-82.5 Q88.6,-63.2 106.9,-49.9 Z"/>
    </g>

    <!-- baked open-book mark: two curved "pages" meeting at a center spine -->
    <g id="bookMark">
      <path d="M-4,-46 C-4,-46 -60,-30 -60,-30 L-60,28 C-60,28 -4,44 -4,44 Z" fill="#152442"/>
      <path d="M4,-46 C4,-46 60,-30 60,-30 L60,28 C60,28 4,44 4,44 Z" fill="#152442"/>
    </g>

    <clipPath id="logoCircleClip"><circle cx="0" cy="0" r="110"/></clipPath>
    <clipPath id="sealClip"><circle cx="0" cy="0" r="150"/></clipPath>
  </defs>

  <!-- ============================= BACKGROUND (baked) ============================= -->
  <rect x="0" y="0" width="3508" height="2481" fill="#FCFBF6"/>
  <use href="#cornerRibbon" xlink:href="#cornerRibbon" x="0" y="0"/>
  <use href="#cornerRibbon" xlink:href="#cornerRibbon" x="3508" y="2481" transform="rotate(180,3508,2481)"/>
  <rect x="48" y="48" width="3412" height="2385" fill="none" stroke="url(#goldGrad)" stroke-width="4"/>

  <!-- ============================= LOGO (optional; hidden entirely via templates.json
       hide_container:"logo-block" when opt-logo-slot is empty). Org name text below
       is an INDEPENDENT sibling, not nested here, so it always renders regardless
       of whether a logo image is supplied — matching every other template. ============================= -->
  <g id="logo-block" transform="translate(1754,180)">
    <circle cx="0" cy="0" r="110" fill="#FBF6E9" stroke="url(#goldGrad)" stroke-width="6"/>
    <circle cx="0" cy="0" r="94" fill="none" stroke="#152442" stroke-width="1.5" opacity="0.3"/>
    <!-- OPTIONAL: pipeline adds href="data:image/png;base64,..." here. Omit href
         entirely when unused — an empty href="" crashes some SVG renderers. -->
    <image id="opt-logo-slot" x="-110" y="-110" width="220" height="220"
           clip-path="url(#logoCircleClip)" preserveAspectRatio="xMidYMid slice"/>
  </g>

  <text id="institution-name" x="1754" y="450" text-anchor="middle" font-size="130"
        font-weight="800" letter-spacing="3" fill="#152442">Organization&#8217;s Name</text>
  <text id="opt-subtitle" x="1754" y="500" text-anchor="middle" font-size="36"
        letter-spacing="5" fill="#152442">CERTIFICATES MADE SIMPLE</text>

  <!-- ============================= TITLE ============================= -->
  <text x="1754" y="793" text-anchor="middle" font-size="309" font-weight="800"
        letter-spacing="8" fill="#152442">CERTIFICATE</text>
  <text id="certificate-type" x="1754" y="934" text-anchor="middle" font-size="115"
        font-weight="700" letter-spacing="17" fill="#C9A227">OF COMPLETION</text>
  <line x1="692" y1="961" x2="1221" y2="961" stroke="#C9A227" stroke-width="3"/>
  <line x1="2259" y1="961" x2="2814" y2="961" stroke="#C9A227" stroke-width="3"/>

  <!-- ============================= AWARD STATEMENT ============================= -->
  <text x="1754" y="1015" text-anchor="middle" font-size="57" letter-spacing="5" fill="#333029">THIS IS TO CERTIFY THAT</text>

  <text id="recipient-name" x="1754" y="1274" text-anchor="middle" font-size="150"
        font-weight="500" fill="#152442">Recipient&#8217;s Full Name</text>
  <line x1="649" y1="1323" x2="2854" y2="1323" stroke="#C9A227" stroke-width="2.5"/>

  <!-- ============================= COMPLETION LINE ============================= -->
  <text x="1754" y="1452" text-anchor="middle" font-size="74" fill="#333029">has successfully completed the</text>
  <text id="course-title" x="1754" y="1556" text-anchor="middle" font-size="91"
        font-weight="700" fill="#152442">Title of Course / Program</text>

  <text x="1754" y="1647" text-anchor="middle" font-size="61" fill="#6B6250">
    <tspan x="1754" dy="0">In recognition of your dedication, hard work and commitment to</tspan>
    <tspan x="1754" dy="68">personal and professional growth.</tspan>
  </text>

  <!-- ============================= SEAL (baked default; org-overridable via opt-seal-slot) ============================= -->
  <g id="seal-block" transform="translate(1754,2043) scale(1.5)">
    <path fill="url(#goldGrad)" stroke="#8E6E22" stroke-width="1"
          d="M160.0,0.0 L147.4,13.7 L157.3,29.4 L142.4,40.5 L149.2,57.8 L132.5,66.0 L136.0,84.2 L118.1,89.2 L118.2,107.8 L99.7,109.4 L96.4,127.7 L77.9,125.8 L71.3,143.2 L53.5,138.0 L43.8,153.9 L27.2,145.5 L14.8,159.3 L0.0,148.0 L-14.8,159.3 L-27.2,145.5 L-43.8,153.9 L-53.5,138.0 L-71.3,143.2 L-77.9,125.8 L-96.4,127.7 L-99.7,109.4 L-118.2,107.8 L-118.1,89.2 L-136.0,84.2 L-132.5,66.0 L-149.2,57.8 L-142.4,40.5 L-157.3,29.4 L-147.4,13.7 L-160.0,0.0 L-147.4,-13.7 L-157.3,-29.4 L-142.4,-40.5 L-149.2,-57.8 L-132.5,-66.0 L-136.0,-84.2 L-118.1,-89.2 L-118.2,-107.8 L-99.7,-109.4 L-96.4,-127.7 L-77.9,-125.8 L-71.3,-143.2 L-53.5,-138.0 L-43.8,-153.9 L-27.2,-145.5 L-14.8,-159.3 L-0.0,-148.0 L14.8,-159.3 L27.2,-145.5 L43.8,-153.9 L53.5,-138.0 L71.3,-143.2 L77.9,-125.8 L96.4,-127.7 L99.7,-109.4 L118.2,-107.8 L118.1,-89.2 L136.0,-84.2 L132.5,-66.0 L149.2,-57.8 L142.4,-40.5 L157.3,-29.4 L147.4,-13.7 Z"/>
    <circle cx="0" cy="0" r="130" fill="none" stroke="#7A5E1E" stroke-width="1" opacity="0.7"/>
    <circle cx="0" cy="0" r="110" fill="none" stroke="#7A5E1E" stroke-width="0.7" opacity="0.5"/>
    <use href="#wreathLeft" xlink:href="#wreathLeft"/>
    <use href="#wreathRight" xlink:href="#wreathRight"/>
    <use href="#bookMark" xlink:href="#bookMark" transform="translate(0,-46) scale(0.4)"/>
    <text x="0" y="12" text-anchor="middle" font-size="26" font-weight="800" letter-spacing="2" fill="#152442">CERTSIFT</text>
    <text x="0" y="46" text-anchor="middle" font-size="24" font-weight="700" letter-spacing="3" fill="#152442">VERIFIED</text>
    <path d="M0,74 L4.7,85.5 L17.2,85.7 L7.5,93.1 L11.0,104.8 L0,98 L-11.0,104.8 L-7.5,93.1 L-17.2,85.7 L-4.7,85.5 Z" fill="#152442"/>

    <!-- OPTIONAL: if an org supplies its own seal/badge artwork, the pipeline
         adds href="data:image/png;base64,..." here. Being last in this group,
         it renders on top and fully covers the baked seal above. Omit href
         entirely when unused — an empty href="" crashes some SVG renderers. -->
    <image id="opt-seal-slot" x="-150" y="-150" width="300" height="300"
           clip-path="url(#sealClip)" preserveAspectRatio="xMidYMid slice"/>
  </g>

  <!-- ============================= DATE (left) ============================= -->
  <text x="845" y="2013" text-anchor="middle" font-size="72" font-weight="700" fill="#152442">
    <tspan id="award-month">Month</tspan> <tspan id="award-day">Day</tspan>, <tspan id="award-year">Year</tspan>
  </text>
  <line x1="444" y1="2041" x2="1245" y2="2041" stroke="#C9A227" stroke-width="2.5"/>
  <text x="845" y="2114" text-anchor="middle" font-size="34" letter-spacing="3" fill="#6B6250">DATE</text>

  <!-- ============================= SIGNATURE (right) ============================= -->
  <g id="signature-1-block">
    <g id="signature-1-placeholder">
      <rect x="2262" y="1894" width="800" height="170" fill="none" stroke="#AEB7C6" stroke-width="2" stroke-dasharray="8 6"/>
      <text x="2662" y="1984" text-anchor="middle" font-size="28" fill="#B0A88E">Signature (PNG)</text>
    </g>
    <image id="signature-1" x="2262" y="1894" width="800" height="170" preserveAspectRatio="xMidYMid meet"/>
    <line x1="2312" y1="2084" x2="3012" y2="2084" stroke="#C9A227" stroke-width="2.5"/>
    <text id="signature-1-caption" x="2662" y="2142" text-anchor="middle" font-size="50"
          font-weight="700" fill="#152442">Authority&#8217;s Full Name</text>
    <text id="signature-1-title" x="2662" y="2194" text-anchor="middle" font-size="40"
          letter-spacing="3" fill="#6B6250">PROGRAM DIRECTOR</text>
  </g>

  <!-- ============================= FOOTER ============================= -->
  <text id="certificate-number-label" x="100" y="2380" font-size="34" fill="#6B6250">Certificate ID:</text>
  <!-- system-generated: populate programmatically, do not expose to end-user editing UI -->
  <text id="certificate-number" x="350" y="2380" font-size="34" font-weight="700" fill="#152442">CS-2026-0000</text>

  <text x="1754" y="2380" text-anchor="middle" font-size="32" letter-spacing="2" fill="#152442"><tspan fill="#C9A227">LEARN</tspan> &#8226; <tspan fill="#C9A227">GROW</tspan> &#8226; <tspan fill="#C9A227">MAKE AN IMPACT</tspan></text>

  <text x="3320" y="2380" text-anchor="end" font-size="30" fill="#152442">Verify at: www.certsift.com/verify</text>

</svg>
