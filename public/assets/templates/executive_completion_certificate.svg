<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="3508" height="2481" viewBox="0 0 3508 2481"
     font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>

  <!-- ============================= DEFS ============================= -->
  <defs>
    <linearGradient id="navyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B2A4A"/>
      <stop offset="100%" stop-color="#0F1A30"/>
    </linearGradient>

    <linearGradient id="goldGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F1DB96"/>
      <stop offset="45%" stop-color="#C9A227"/>
      <stop offset="100%" stop-color="#8E6E22"/>
    </linearGradient>

    <clipPath id="logoClip2"><circle cx="0" cy="0" r="118"/></clipPath>
    <clipPath id="sealClip2"><circle cx="1754" cy="1860" r="150"/></clipPath>

    <g id="cornerRibbon">
      <path d="M0,0 L300,0 L0,300 Z" fill="url(#navyGrad)"/>
      <path d="M0,0 L250,0 L0,250 Z" fill="none" stroke="url(#goldGrad2)" stroke-width="10"/>
    </g>
  </defs>

  <!-- ============================= BACKGROUND ============================= -->
  <rect x="0" y="0" width="3508" height="2481" fill="#FCFBF6"/>

  <use href="#cornerRibbon" xlink:href="#cornerRibbon" x="0" y="0"/>
  <use href="#cornerRibbon" xlink:href="#cornerRibbon" x="3508" y="2481" transform="rotate(180,3508,2481)"/>

  <rect x="48" y="48" width="3412" height="2385" fill="none" stroke="url(#goldGrad2)" stroke-width="4"/>

  <!-- ============================= LOGO ============================= -->
  <g id="logo-block" transform="translate(1754,240)">
    <circle cx="0" cy="0" r="130" fill="#FBF6E9" stroke="url(#goldGrad2)" stroke-width="6"/>
    <circle cx="0" cy="0" r="110" fill="none" stroke="#152442" stroke-width="1.5" opacity="0.35"/>
    <image id="opt-logo-slot" x="-118" y="-118" width="236" height="236" href="" xlink:href="" clip-path="url(#logoClip2)" preserveAspectRatio="xMidYMid slice"/>
  </g>

  <!-- ============================= INSTITUTION NAME ============================= -->
  <text id="institution-name" x="1754" y="460" text-anchor="middle" font-size="70" font-weight="700" letter-spacing="4" fill="#152442">NAME OF ISSUING INSTITUTION</text>
  <text id="opt-subtitle" x="1754" y="514" text-anchor="middle" font-size="30" letter-spacing="4" fill="#8E6E22">Department, Ministry, or Subsidiary</text>

  <!-- ============================= TITLE ============================= -->
  <text id="certificate-title" x="1754" y="688" text-anchor="middle" font-size="160" font-weight="800" letter-spacing="6" fill="#152442">CERTIFICATE</text>
  <text x="1754" y="792" text-anchor="middle" font-size="64" font-weight="700" letter-spacing="10" fill="#C9A227">OF COMPLETION</text>
  <line x1="1184" y1="834" x2="1554" y2="834" stroke="#C9A227" stroke-width="2.5"/>
  <line x1="1954" y1="834" x2="2324" y2="834" stroke="#C9A227" stroke-width="2.5"/>

  <!-- ============================= AWARDED TO ============================= -->
  <text x="1754" y="928" text-anchor="middle" font-size="46" letter-spacing="3" fill="#333029">THIS IS TO CERTIFY THAT</text>

  <text id="recipient-name" x="1754" y="1082" text-anchor="middle" font-size="128" font-weight="400" fill="#152442">Recipient&#8217;s Full Name</text>
  <line x1="924" y1="1140" x2="2584" y2="1140" stroke="#C9A227" stroke-width="2"/>

  <!-- ============================= COMPLETION LINE ============================= -->
  <text x="1754" y="1240" text-anchor="middle" font-size="46" fill="#333029">has successfully completed the</text>
  <text id="course-title" x="1754" y="1330" text-anchor="middle" font-size="68" font-weight="700" fill="#152442">Title of Course / Program / Theme of Study</text>

  <!-- Centered — production (resvg-js) renders centered text with inline
       bold tspans correctly; confirmed directly from real generated
       certificates. -->
  <text x="1754" y="1434" text-anchor="middle" font-size="40" fill="#6B6250">
    <tspan x="1754" dy="0">This program was conducted from <tspan id="start-date" font-weight="700" fill="#152442">Start Date</tspan> to <tspan id="end-date" font-weight="700" fill="#152442">End Date</tspan>, covering core modules,</tspan>
    <tspan x="1754" dy="56">practical applications, and foundational principles outlined by the organizing body.</tspan>
  </text>

  <text x="1754" y="1596" text-anchor="middle" font-size="40" fill="#6B6250">
    <tspan x="1754" dy="0">In recognition of your dedication, hard work and commitment to</tspan>
    <tspan x="1754" dy="56">personal and professional growth.</tspan>
  </text>

  <!-- ============================= SEAL ============================= -->
  <g id="seal-block">
    <circle cx="1754" cy="1860" r="152" fill="url(#goldGrad2)" stroke="#8E6E22" stroke-width="2"/>
    <circle cx="1754" cy="1860" r="130" fill="none" stroke="#7A5E1E" stroke-width="1.5" opacity="0.7"/>
    <circle cx="1754" cy="1860" r="108" fill="none" stroke="#7A5E1E" stroke-width="1" opacity="0.5"/>
    <image id="opt-seal-slot" x="1604" y="1710" width="300" height="300" href="" xlink:href="" clip-path="url(#sealClip2)" preserveAspectRatio="xMidYMid slice"/>
  </g>

  <!-- ============================= DATE (left) ============================= -->
  <text x="580" y="1772" font-size="58" font-weight="700" fill="#152442">
    <tspan id="award-month">Month</tspan> <tspan id="award-day">Day</tspan>, <tspan id="award-year">Year</tspan>
  </text>
  <line x1="570" y1="1818" x2="1050" y2="1818" stroke="#C9A227" stroke-width="2"/>
  <text x="810" y="1868" text-anchor="middle" font-size="34" letter-spacing="2" fill="#6B6250">DATE</text>

  <!-- ============================= SIGNATURE (right) ============================= -->
  <g id="signature-1-block">
    <g id="signature-1-placeholder">
      <rect x="2430" y="1688" width="380" height="100" fill="none" stroke="#AEB7C6" stroke-width="2" stroke-dasharray="8 6"/>
      <text x="2620" y="1744" text-anchor="middle" font-size="24" fill="#B0A88E">Signature (PNG)</text>
    </g>
    <image id="signature-1" x="2430" y="1688" width="380" height="100" href="" xlink:href="" preserveAspectRatio="xMidYMid meet"/>
    <line x1="2430" y1="1818" x2="2930" y2="1818" stroke="#C9A227" stroke-width="2"/>
    <text id="signature-1-caption" x="2680" y="1868" text-anchor="middle" font-size="36" fill="#152442" font-weight="700"></text>
    <text id="signature-1-title" x="2680" y="1914" text-anchor="middle" font-size="29" font-style="italic" fill="#6B6250"></text>
  </g>

  <!-- ============================= FOOTER ============================= -->
  <text id="certificate-number-label" x="230" y="2360" font-size="34" fill="#6B6250">Certificate ID:</text>
  <!-- system-generated: populate programmatically, do not expose to end-user editing UI -->
  <text id="certificate-number" x="470" y="2360" font-size="34" font-weight="700" fill="#152442">CS-2026-0000</text>

  <text x="1754" y="2360" text-anchor="middle" font-size="32" letter-spacing="2" fill="#152442"><tspan fill="#C9A227">LEARN</tspan> &#8226; <tspan fill="#C9A227">GROW</tspan> &#8226; <tspan fill="#C9A227">MAKE AN IMPACT</tspan></text>

  <text x="3278" y="2360" text-anchor="end" font-size="32" fill="#152442">Verify at: certsift.com</text>

</svg>
